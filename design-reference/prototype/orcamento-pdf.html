<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento — Advance Tecnologia</title>
<link rel="stylesheet" href="_ds/advance-brand-design-system-26bb5022-c968-4bcd-9910-832a76b36045/tokens/fonts.css">
<link rel="stylesheet" href="_ds/advance-brand-design-system-26bb5022-c968-4bcd-9910-832a76b36045/tokens/colors.css">
<link rel="stylesheet" href="_ds/advance-brand-design-system-26bb5022-c968-4bcd-9910-832a76b36045/tokens/typography.css">
<link rel="stylesheet" href="_ds/advance-brand-design-system-26bb5022-c968-4bcd-9910-832a76b36045/tokens/spacing.css">
<link rel="stylesheet" href="_ds/advance-brand-design-system-26bb5022-c968-4bcd-9910-832a76b36045/tokens/radius-depth.css">
<style>
doc-page:not(:defined){visibility:hidden}
*{box-sizing:border-box}
.doc{font-family:var(--font-sans);color:var(--neutral-900);font-size:12.5px;line-height:1.55}
.doc .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* Header band with subtle technical grid */
.pdf-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:22px;border-bottom:2px solid var(--primary-600);position:relative}
.pdf-head::before{content:"";position:absolute;inset:-10px -6px 14px;background-image:linear-gradient(to right,rgba(35,80,159,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(35,80,159,.06) 1px,transparent 1px);background-size:20px 20px;-webkit-mask-image:linear-gradient(105deg,#000 22%,transparent 58%);mask-image:linear-gradient(105deg,#000 22%,transparent 58%);pointer-events:none}
.pdf-head .brand img{height:26px;display:block;margin-bottom:12px}
.pdf-head .brand .tag{font-size:11px;color:var(--neutral-500);letter-spacing:.02em;max-width:230px;line-height:1.5}
.pdf-head .doc-id{text-align:right;position:relative}
.pdf-head .doc-id .eyebrow{font-family:var(--font-serif);font-style:italic;font-size:15px;color:var(--primary-600);letter-spacing:.01em}
.pdf-head .doc-id h1{font-family:var(--font-serif);font-size:34px;font-weight:700;letter-spacing:-.01em;margin:2px 0 8px;line-height:1;color:var(--neutral-900)}
.pdf-head .doc-id .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--neutral-600);line-height:1.7}
.pdf-head .doc-id .meta b{color:var(--neutral-900)}
/* section */
.sec{margin-top:26px}
.sec-label{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--primary-700);margin-bottom:10px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.kv dt{color:var(--neutral-500)}
.kv dd{margin:0;font-weight:500;color:var(--neutral-900)}
.kv dd.mono{font-family:var(--font-mono)}
.block-title{font-size:15px;font-weight:600;margin:0 0 3px}
table.items{width:100%;border-collapse:collapse;margin-top:4px;font-size:12px}
table.items thead th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--neutral-500);padding:8px 12px;background:var(--neutral-50);border-top:1px solid var(--neutral-300);border-bottom:1px solid var(--neutral-300)}
table.items thead th.r{text-align:right}
table.items tbody td{padding:9px 12px;border-bottom:1px solid var(--neutral-200);vertical-align:top}
table.items tbody td.r{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.items tbody td.desc{font-weight:500}
.totals{margin-top:16px;display:flex;justify-content:flex-end;break-inside:avoid}
.totals .box{width:290px}
.totals .row{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;color:var(--neutral-600)}
.totals .row .mono{color:var(--neutral-900)}
.totals .row.total{border-top:2px solid var(--primary-600);margin-top:6px;padding-top:12px;font-size:16px;font-weight:700;color:var(--neutral-900)}
.totals .row.total .mono{color:var(--primary-700)}
.cond{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;break-inside:avoid}
.cond .item .l{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--neutral-500);margin-bottom:3px}
.cond .item .v{font-size:12.5px;font-weight:500}
.obs{margin-top:24px;padding:14px 16px;background:var(--neutral-50);border-left:3px solid var(--primary-400);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px;color:var(--neutral-700);line-height:1.6;break-inside:avoid}
.obs .l{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--neutral-500);margin-bottom:4px}
.pdf-foot{border-top:1px solid var(--neutral-300);padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--neutral-500)}
.pdf-foot .mono{font-family:var(--font-mono)}
.sign{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:60px;break-inside:avoid}
.sign .line{border-top:1px solid var(--neutral-400);padding-top:7px;font-size:11px;color:var(--neutral-600);text-align:center}
</style>
</head>
<body>
<doc-page size="a4" margin="0.6in"><div class="doc" id="doc"></div></doc-page>
<script src="data.js"></script>
<script src="doc-page.js"></script>
<script>
const num=new URLSearchParams(location.search).get('num')||'0148';
const o=ORCAMENTOS.find(x=>x.num===num)||ORCAMENTOS[0];
const c=CLIENTS[o.cliente],m=MOLDS[o.molde];
const sub=orcSubtotal(o),tot=orcTotal(o);
const itemRows=o.itens.map(i=>`<tr><td class="desc">${i.d}</td><td class="r">${i.q}</td><td class="r">${fmtBRLc(i.vu)}</td><td class="r">${fmtBRLc(i.q*i.vu)}</td></tr>`).join('');
document.getElementById('doc').innerHTML=`
<div class="pdf-head">
  <div class="brand"><img src="assets/logo-advance-blue.png" alt="Advance Tecnologia"><div class="tag">${ADVANCE.nome}<br>Moldes de injeção plástica · Precisão ±0,001 mm</div></div>
  <div class="doc-id"><div class="eyebrow">Proposta comercial</div><h1>Orçamento ${o.num}</h1>
    <div class="meta">Emissão <b>${fmtDate(o.data)}</b><br>Validade <b>${fmtDate(o.validade)}</b></div></div>
</div>

<div class="sec cols2">
  <div><div class="sec-label">Cliente</div>
    <div class="block-title">${c.nome}</div>
    <dl class="kv" style="margin-top:8px"><dt>CNPJ</dt><dd class="mono">${c.cnpj}</dd><dt>Contato</dt><dd>${c.contato}</dd><dt>Telefone</dt><dd class="mono">${c.fone}</dd><dt>E-mail</dt><dd>${c.email}</dd><dt>Cidade</dt><dd>${c.cidade}</dd></dl>
  </div>
  <div><div class="sec-label">Molde &amp; serviço</div>
    <div class="block-title">${m.cod} — ${m.desc}</div>
    <dl class="kv" style="margin-top:8px"><dt>Serviço</dt><dd>${SVC_TYPE[o.tipo]}</dd><dt>Cavidades</dt><dd class="mono">${m.cav}</dd><dt>Tipo</dt><dd>${m.tipo}</dd><dt>Prazo</dt><dd>${o.prazo||'A combinar'}</dd></dl>
  </div>
</div>

<div class="sec"><div class="sec-label">Descrição dos serviços</div>
  <table class="items"><thead><tr><th>Descrição</th><th class="r">Qtd.</th><th class="r">Valor unit.</th><th class="r">Total</th></tr></thead><tbody>${itemRows}</tbody></table>
  <div class="totals"><div class="box">
    <div class="row"><span>Subtotal</span><span class="mono">${fmtBRLc(sub)}</span></div>
    <div class="row"><span>Desconto</span><span class="mono">${o.desconto?'− '+fmtBRLc(o.desconto):fmtBRLc(0)}</span></div>
    <div class="row total"><span>TOTAL</span><span class="mono">${fmtBRLc(tot)}</span></div>
  </div></div>
</div>

<div class="cond">
  <div class="item"><div class="l">Prazo de entrega</div><div class="v">${o.prazo||'A combinar'}</div></div>
  <div class="item"><div class="l">Validade da proposta</div><div class="v">${fmtDate(o.validade)}</div></div>
  <div class="item"><div class="l">Condição de pagamento</div><div class="v">${o.pagto||'A combinar'}</div></div>
  <div class="item"><div class="l">Local do serviço</div><div class="v">Planta Advance · Embu das Artes · SP</div></div>
</div>

${o.obs?`<div class="obs"><div class="l">Observações</div>${o.obs}</div>`:''}

<div class="sign">
  <div class="line">Advance Tecnologia em Moldes</div>
  <div class="line">${c.nome}</div>
</div>

<div class="pdf-foot" style="margin-top:40px">
  <span>${ADVANCE.nome} · CNPJ ${ADVANCE.cnpj}</span>
  <span class="mono">${ADVANCE.fone} · ${ADVANCE.site}</span>
</div>`;
document.title=`Orçamento ${o.num} — Advance`;
</script>
</body>
</html>
